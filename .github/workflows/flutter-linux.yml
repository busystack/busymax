name: Flutter Linux

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libhandy-1-dev \
            libstdc++-12-dev \
            libsecret-1-dev \
            libjsoncpp-dev \
            liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs --force-jit

      - name: Verify generated files are committed
        run: git diff --exit-code

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Check platform boundaries
        run: dart run tool/check_platform_boundaries.dart

      - name: Test
        run: flutter test

      - name: Validate release provider configuration
        if: github.event_name == 'push'
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          MICROSOFT_OAUTH_CLIENT_ID: ${{ vars.MICROSOFT_OAUTH_CLIENT_ID }}
        run: |
          if [ -z "$GOOGLE_OAUTH_CLIENT_ID" ] ||
             [ -z "$GOOGLE_OAUTH_CLIENT_SECRET" ] ||
             [ -z "$MICROSOFT_OAUTH_CLIENT_ID" ]; then
            echo '::error::Release provider configuration is incomplete.'
            exit 1
          fi

      - name: Build Linux release
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          MICROSOFT_OAUTH_CLIENT_ID: ${{ vars.MICROSOFT_OAUTH_CLIENT_ID }}
        run: |
          args=(--release)
          if [ -n "$GOOGLE_OAUTH_CLIENT_ID" ]; then
            args+=("--dart-define=GOOGLE_OAUTH_CLIENT_ID=$GOOGLE_OAUTH_CLIENT_ID")
          fi
          if [ -n "$GOOGLE_OAUTH_CLIENT_SECRET" ]; then
            args+=("--dart-define=GOOGLE_OAUTH_CLIENT_SECRET=$GOOGLE_OAUTH_CLIENT_SECRET")
          fi
          if [ -n "$MICROSOFT_OAUTH_CLIENT_ID" ]; then
            args+=("--dart-define=MICROSOFT_OAUTH_CLIENT_ID=$MICROSOFT_OAUTH_CLIENT_ID")
          fi
          flutter build linux -t lib/main_linux.dart "${args[@]}"

      - name: Verify release provider configuration
        if: github.event_name == 'push'
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          MICROSOFT_OAUTH_CLIENT_ID: ${{ vars.MICROSOFT_OAUTH_CLIENT_ID }}
        run: |
          binary=build/linux/x64/release/bundle/lib/libapp.so
          grep -aFq -- "$GOOGLE_OAUTH_CLIENT_ID" "$binary"
          grep -aFq -- "$GOOGLE_OAUTH_CLIENT_SECRET" "$binary"
          grep -aFq -- "$MICROSOFT_OAUTH_CLIENT_ID" "$binary"

      - name: Build strict Snap from the release bundle
        id: snapcraft
        uses: snapcore/action-build@v1

      - name: Upload Snap artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: busymax-snap
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error

      - name: Install strict Snap
        run: >-
          sudo snap install --dangerous
          "${{ steps.snapcraft.outputs.snap }}"

      - name: Verify installed strict Snap
        run: |
          LC_ALL=C snap info --verbose busymax |
            grep -Eq '^[[:space:]]*confinement:[[:space:]]+strict$'
          snap run --shell busymax -c 'test -x "$SNAP/busymax"'
