name: Flutter Linux

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libhandy-1-dev \
            libstdc++-12-dev \
            libsecret-1-dev \
            libjsoncpp-dev \
            liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Verify pinned Flutter and bundled Dart
        run: |
          flutter_executable="$(readlink -f "$(command -v flutter)")"
          flutter_bin="$(dirname "$flutter_executable")"
          dart_executable="$flutter_bin/cache/dart-sdk/bin/dart"
          test -x "$dart_executable"
          "$dart_executable" tool/verify_flutter_sdk.dart \
            --flutter "$flutter_executable" \
            --dart "$dart_executable" \
            --expected-flutter 3.47.2 \
            --expected-dart 3.13.2
          printf 'BUSYMAX_FLUTTER_EXECUTABLE=%s\n' "$flutter_executable" >> "$GITHUB_ENV"
          printf 'BUSYMAX_DART_EXECUTABLE=%s\n' "$dart_executable" >> "$GITHUB_ENV"

      - name: Enable Linux desktop
        run: '"$BUSYMAX_FLUTTER_EXECUTABLE" config --enable-linux-desktop'

      - name: Resolve dependencies
        run: '"$BUSYMAX_FLUTTER_EXECUTABLE" pub get --enforce-lockfile'

      - name: Generate localizations
        run: '"$BUSYMAX_FLUTTER_EXECUTABLE" gen-l10n'

      - name: Generate Drift code
        run: >-
          "$BUSYMAX_DART_EXECUTABLE" run build_runner build
          --delete-conflicting-outputs --force-jit

      - name: Verify generated files are committed
        run: git diff --exit-code

      - name: Check formatting
        run: >-
          "$BUSYMAX_DART_EXECUTABLE" format
          --output=none --set-exit-if-changed .

      - name: Analyze
        run: '"$BUSYMAX_FLUTTER_EXECUTABLE" analyze'

      - name: Check platform boundaries
        run: >-
          "$BUSYMAX_DART_EXECUTABLE" run tool/check_platform_boundaries.dart

      - name: Test
        run: '"$BUSYMAX_FLUTTER_EXECUTABLE" test'

      - name: Validate release provider configuration
        if: github.event_name == 'push'
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          MICROSOFT_OAUTH_CLIENT_ID: ${{ vars.MICROSOFT_OAUTH_CLIENT_ID }}
        run: |
          if [ -z "$GOOGLE_OAUTH_CLIENT_ID" ] ||
             [ -z "$GOOGLE_OAUTH_CLIENT_SECRET" ] ||
             [ -z "$MICROSOFT_OAUTH_CLIENT_ID" ]; then
            echo '::error::Release provider configuration is incomplete.'
            exit 1
          fi

      - name: Build Linux release
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          MICROSOFT_OAUTH_CLIENT_ID: ${{ vars.MICROSOFT_OAUTH_CLIENT_ID }}
        run: |
          args=(--release)
          if [ -n "$GOOGLE_OAUTH_CLIENT_ID" ]; then
            args+=("--dart-define=GOOGLE_OAUTH_CLIENT_ID=$GOOGLE_OAUTH_CLIENT_ID")
          fi
          if [ -n "$GOOGLE_OAUTH_CLIENT_SECRET" ]; then
            args+=("--dart-define=GOOGLE_OAUTH_CLIENT_SECRET=$GOOGLE_OAUTH_CLIENT_SECRET")
          fi
          if [ -n "$MICROSOFT_OAUTH_CLIENT_ID" ]; then
            args+=("--dart-define=MICROSOFT_OAUTH_CLIENT_ID=$MICROSOFT_OAUTH_CLIENT_ID")
          fi
          "$BUSYMAX_FLUTTER_EXECUTABLE" build linux \
            -t lib/main_linux.dart "${args[@]}"

      - name: Verify release provider configuration
        if: github.event_name == 'push'
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          MICROSOFT_OAUTH_CLIENT_ID: ${{ vars.MICROSOFT_OAUTH_CLIENT_ID }}
        run: |
          binary=build/linux/x64/release/bundle/lib/libapp.so
          grep -aFq -- "$GOOGLE_OAUTH_CLIENT_ID" "$binary"
          grep -aFq -- "$GOOGLE_OAUTH_CLIENT_SECRET" "$binary"
          grep -aFq -- "$MICROSOFT_OAUTH_CLIENT_ID" "$binary"

      - name: Build strict Snap from the release bundle
        id: snapcraft
        uses: snapcore/action-build@v1

      - name: Upload Snap artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: busymax-snap
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error
          retention-days: 7

      - name: Install strict Snap
        run: >-
          sudo snap install --dangerous
          "${{ steps.snapcraft.outputs.snap }}"

      - name: Verify installed strict Snap
        run: |
          LC_ALL=C snap info --verbose busymax |
            grep -Eq '^[[:space:]]*confinement:[[:space:]]+strict$'
          # shellcheck disable=SC2016
          snap run --shell busymax -c 'test -x "$SNAP/busymax"'
