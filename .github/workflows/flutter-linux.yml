name: Flutter Linux

on:
  workflow_dispatch:
    inputs:
      production_release:
        description: 'Build an official production Snap (main only)'
        type: boolean
        required: true
        default: false
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Require main for manual runs
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo '::error::Manual Linux builds must run from main.'
          exit 1

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate release PR source branch
        if: github.event_name == 'pull_request'
        env:
          RELEASE_PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 tool/check_release_pull_request.py

      - name: Materialize pinned shared dependencies
        run: python3 tool/checkout_shared_dependencies.py

      - name: Install Linux build dependencies
        run: |
          printf 'https://archive.ubuntu.com/ubuntu/\n' | \
            sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          apt_options=(
            -o Acquire::Retries=2
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libhandy-1-dev \
            libstdc++-12-dev \
            libsecret-1-dev \
            libjsoncpp-dev \
            liblzma-dev \
            librsvg2-common \
            locales \
            yaru-theme-icon \
            xvfb
          sudo locale-gen en_US.UTF-8 en_GB.UTF-8

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Verify pinned Flutter and bundled Dart
        run: |
          flutter_executable="$(readlink -f "$(command -v flutter)")"
          flutter_bin="$(dirname "$flutter_executable")"
          dart_executable="$flutter_bin/cache/dart-sdk/bin/dart"
          test -x "$dart_executable"
          "$dart_executable" tool/verify_flutter_sdk.dart \
            --flutter "$flutter_executable" \
            --dart "$dart_executable" \
            --expected-flutter 3.47.5 \
            --expected-dart 3.13.4
          printf 'BUSYMAX_FLUTTER_EXECUTABLE=%s\n' "$flutter_executable" >> "$GITHUB_ENV"
          printf 'BUSYMAX_DART_EXECUTABLE=%s\n' "$dart_executable" >> "$GITHUB_ENV"

      - name: Enable Linux desktop
        run: '"$BUSYMAX_FLUTTER_EXECUTABLE" config --enable-linux-desktop'

      - name: Resolve dependencies
        run: '"$BUSYMAX_FLUTTER_EXECUTABLE" pub get --enforce-lockfile'

      - name: Generate localizations
        run: '"$BUSYMAX_FLUTTER_EXECUTABLE" gen-l10n'

      - name: Generate Drift code
        run: >-
          "$BUSYMAX_DART_EXECUTABLE" run build_runner build
          --delete-conflicting-outputs --force-jit

      - name: Verify generated files are committed
        run: git diff --exit-code

      - name: Check formatting
        run: >-
          "$BUSYMAX_DART_EXECUTABLE" format
          --output=none --set-exit-if-changed .

      - name: Analyze
        run: '"$BUSYMAX_FLUTTER_EXECUTABLE" analyze'

      - name: Check platform boundaries
        run: >-
          "$BUSYMAX_DART_EXECUTABLE" run tool/check_platform_boundaries.dart

      - name: Test
        run: '"$BUSYMAX_FLUTTER_EXECUTABLE" test'

      - name: Test GTK header-icon bridge
        run: |
          gtk_config="$RUNNER_TEMP/busymax-gtk-config"
          mkdir -p "$gtk_config/gtk-3.0"
          printf '[Settings]\ngtk-icon-theme-name=Yaru\n' \
            > "$gtk_config/gtk-3.0/settings.ini"
          XDG_CONFIG_HOME="$gtk_config" xvfb-run -a \
            "$BUSYMAX_FLUTTER_EXECUTABLE" test \
            integration_test/gtk_header_icons_integration_test.dart -d linux

      - name: Test native clock patterns, weekday locale, and GTK time picker
        run: |
          mkdir -p build/linux/native-tests
          g++ -std=c++17 -Wall -Wextra -Werror \
            windows/runner/tests/short_time_pattern_test.cpp \
            -o build/linux/native-tests/short_time_pattern_test
          build/linux/native-tests/short_time_pattern_test
          g++ -std=c++17 -Wall -Wextra -Werror \
            linux/runner/tests/first_weekday_test.cc \
            -o build/linux/native-tests/first_weekday_test
          build/linux/native-tests/first_weekday_test
          mkdir -p build/linux/native-tests/weekday-schemas
          glib-compile-schemas --strict \
            --targetdir=build/linux/native-tests/weekday-schemas \
            linux/runner/tests/schemas
          g++ -std=c++17 -Wall -Wextra -Werror \
            linux/runner/tests/first_weekday_preference_test.cc \
            linux/runner/first_weekday_preference.cc \
            -o build/linux/native-tests/first_weekday_preference_test \
            $(pkg-config --cflags --libs gio-2.0)
          build/linux/native-tests/first_weekday_preference_test \
            build/linux/native-tests/weekday-schemas
          LC_ALL=C.UTF-8 MALLOC_PERTURB_=165 \
            build/linux/native-tests/first_weekday_test
          g++ -std=c++17 -Wall -Wextra -Werror \
            -fsanitize=address -fno-omit-frame-pointer \
            linux/runner/tests/first_weekday_test.cc \
            -o build/linux/native-tests/first_weekday_test_asan
          ASAN_OPTIONS=detect_leaks=0 \
            build/linux/native-tests/first_weekday_test_asan
          g++ -std=c++17 -Wall -Wextra -Werror \
            linux/runner/tests/time_picker_test.cc \
            -o build/linux/native-tests/time_picker_test \
            $(pkg-config --cflags --libs gtk+-3.0)
          xvfb-run -a build/linux/native-tests/time_picker_test
          g++ -std=c++17 -Wall -Wextra -Werror \
            linux/runner/tests/gtk_window_preferences_test.cc \
            linux/runner/gtk_window_preferences.cc \
            -o build/linux/native-tests/gtk_window_preferences_test \
            $(pkg-config --cflags --libs gtk+-3.0)
          xvfb-run -a build/linux/native-tests/gtk_window_preferences_test
          g++ -std=c++17 -Wall -Wextra -Werror \
            linux/runner/tests/gtk_header_icons_test.cc \
            linux/runner/gtk_header_icons.cc \
            -o build/linux/native-tests/gtk_header_icons_test \
            $(pkg-config --cflags --libs gtk+-3.0)
          XDG_CONFIG_HOME="$RUNNER_TEMP/busymax-gtk-config" \
            xvfb-run -a sh -c 'build/linux/native-tests/gtk_header_icons_test'
          g++ -std=c++17 -Wall -Wextra -Werror \
            linux/runner/tests/gtk_search_entry_theme_test.cc \
            linux/runner/gtk_search_entry_theme.cc \
            -o build/linux/native-tests/gtk_search_entry_theme_test \
            $(pkg-config --cflags --libs gtk+-3.0)
          xvfb-run -a env GDK_BACKEND=x11 \
            build/linux/native-tests/gtk_search_entry_theme_test

      - name: Test native registration helper teardown
        run: python3 test/tool/registration_native_helper_test.py

      - name: Test native registration configuration handles
        run: |
          cmake -S native/registration_reader -B build/linux/registration-reader-tests
          cmake --build build/linux/registration-reader-tests --target busymax_registration_reader_tests
          ctest --test-dir build/linux/registration-reader-tests --output-on-failure

      - name: Build unconfigured release with usable custom registration paths
        run: |
          "$BUSYMAX_FLUTTER_EXECUTABLE" build linux --release -t lib/main_linux.dart
          test -f build/linux/x64/release/bundle/data/flutter_assets/docs/google_setup.md
          test -f build/linux/x64/release/bundle/data/flutter_assets/docs/microsoft_setup.md

      - name: Validate production registrations and protected originals
        if: github.event_name == 'workflow_dispatch' && inputs.production_release && github.ref == 'refs/heads/main'
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_PROJECT_ID: ${{ vars.GOOGLE_OAUTH_PROJECT_ID }}
          MICROSOFT_OAUTH_CLIENT_ID: ${{ vars.MICROSOFT_OAUTH_CLIENT_ID }}
          MICROSOFT_OAUTH_AUTHORITY_TENANT: ${{ vars.MICROSOFT_OAUTH_AUTHORITY_TENANT }}
          BUSYMAX_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.BUSYMAX_GOOGLE_OAUTH_CLIENT_ID }}
          BUSYMAX_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.BUSYMAX_GOOGLE_OAUTH_CLIENT_SECRET }}
          BUSYMAX_GOOGLE_OAUTH_PROJECT_ID: ${{ vars.BUSYMAX_GOOGLE_OAUTH_PROJECT_ID }}
          BUSYMAX_MICROSOFT_OAUTH_CLIENT_ID: ${{ vars.BUSYMAX_MICROSOFT_OAUTH_CLIENT_ID }}
          BUSYMAX_PRIVACY_POLICY_URL: https://busystack.org/privacy-busymax
        run: '"$BUSYMAX_DART_EXECUTABLE" run tool/check_desktop_oauth_config.dart'

      - name: Build official Linux release with explicit active registrations
        if: github.event_name == 'workflow_dispatch' && inputs.production_release && github.ref == 'refs/heads/main'
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_PROJECT_ID: ${{ vars.GOOGLE_OAUTH_PROJECT_ID }}
          MICROSOFT_OAUTH_CLIENT_ID: ${{ vars.MICROSOFT_OAUTH_CLIENT_ID }}
          MICROSOFT_OAUTH_AUTHORITY_TENANT: ${{ vars.MICROSOFT_OAUTH_AUTHORITY_TENANT }}
          BUSYMAX_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.BUSYMAX_GOOGLE_OAUTH_CLIENT_ID }}
          BUSYMAX_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.BUSYMAX_GOOGLE_OAUTH_CLIENT_SECRET }}
          BUSYMAX_GOOGLE_OAUTH_PROJECT_ID: ${{ vars.BUSYMAX_GOOGLE_OAUTH_PROJECT_ID }}
          BUSYMAX_MICROSOFT_OAUTH_CLIENT_ID: ${{ vars.BUSYMAX_MICROSOFT_OAUTH_CLIENT_ID }}
          BUSYMAX_PRIVACY_POLICY_URL: https://busystack.org/privacy-busymax
        run: |
          registration_file="$(mktemp "$RUNNER_TEMP/busymax-oauth.XXXXXX.json")"
          trap 'rm -f "$registration_file"' EXIT
          python3 - "$registration_file" <<'PYCONFIG'
          import json, os, sys
          keys = [
              'GOOGLE_OAUTH_CLIENT_ID', 'GOOGLE_OAUTH_CLIENT_SECRET',
              'GOOGLE_OAUTH_PROJECT_ID', 'MICROSOFT_OAUTH_CLIENT_ID',
              'MICROSOFT_OAUTH_AUTHORITY_TENANT',
              'BUSYMAX_GOOGLE_OAUTH_CLIENT_ID', 'BUSYMAX_GOOGLE_OAUTH_CLIENT_SECRET',
              'BUSYMAX_GOOGLE_OAUTH_PROJECT_ID', 'BUSYMAX_MICROSOFT_OAUTH_CLIENT_ID',
              'BUSYMAX_PRIVACY_POLICY_URL',
          ]
          with open(sys.argv[1], 'w') as output:
              json.dump({key: os.environ[key] for key in keys if os.environ.get(key)}, output)
          PYCONFIG
          "$BUSYMAX_FLUTTER_EXECUTABLE" build linux --release \
            -t lib/main_linux.dart --dart-define-from-file="$registration_file"
          binary=build/linux/x64/release/bundle/lib/libapp.so
          for key in GOOGLE_OAUTH_CLIENT_ID MICROSOFT_OAUTH_CLIENT_ID \
            BUSYMAX_GOOGLE_OAUTH_CLIENT_ID BUSYMAX_GOOGLE_OAUTH_CLIENT_SECRET \
            BUSYMAX_GOOGLE_OAUTH_PROJECT_ID BUSYMAX_MICROSOFT_OAUTH_CLIENT_ID; do
            grep -aFq -- "${!key}" "$binary"
          done
          if [ -n "$GOOGLE_OAUTH_CLIENT_SECRET" ]; then
            grep -aFq -- "$GOOGLE_OAUTH_CLIENT_SECRET" "$binary"
          fi

      - name: Build strict Snap from the release bundle
        id: snapcraft
        uses: snapcore/action-build@v1

      - name: Build deterministic sibling-layout source archive
        run: python3 tool/package_source.py

      - name: Upload pinned source artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: busymax-source
          path: dist/source/
          if-no-files-found: error
          retention-days: 7

      - name: Install strict Snap
        run: >-
          sudo snap install --dangerous
          "${{ steps.snapcraft.outputs.snap }}"

      - name: Verify installed strict Snap
        run: |
          LC_ALL=C snap info --verbose busymax |
            grep -Eq '^[[:space:]]*confinement:[[:space:]]+strict$'
          # shellcheck disable=SC2016
          snap run --shell busymax -c 'test -x "$SNAP/busymax"'

      - name: Label non-production Snap artifact
        if: github.event_name != 'workflow_dispatch' || !inputs.production_release
        env:
          SNAP_ARTIFACT: ${{ steps.snapcraft.outputs.snap }}
        run: cp -- "$SNAP_ARTIFACT" build/busymax-snap-ci-non-production.snap

      - name: Upload non-production Snap artifact
        if: github.event_name != 'workflow_dispatch' || !inputs.production_release
        uses: actions/upload-artifact@v7
        with:
          name: busymax-snap-ci-non-production
          path: build/busymax-snap-ci-non-production.snap
          if-no-files-found: error
          retention-days: 7

      - name: Upload Snap artifact
        if: github.event_name == 'workflow_dispatch' && inputs.production_release && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: busymax-snap
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error
          retention-days: 7
