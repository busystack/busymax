name: Flutter Linux

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release PR source branch
        if: github.event_name == 'pull_request'
        env:
          RELEASE_PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 tool/check_release_pull_request.py

      - name: Materialize pinned shared dependencies
        run: python3 tool/checkout_shared_dependencies.py

      - name: Install Linux build dependencies
        run: |
          printf 'https://archive.ubuntu.com/ubuntu/\n' | \
            sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          apt_options=(
            -o Acquire::Retries=2
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libhandy-1-dev \
            libayatana-appindicator3-dev \
            libstdc++-12-dev \
            libsecret-1-dev \
            libjsoncpp-dev \
            liblzma-dev \
            librsvg2-common \
            locales \
            yaru-theme-icon \
            xvfb
          sudo locale-gen en_US.UTF-8 en_GB.UTF-8

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Verify pinned Flutter and bundled Dart
        run: |
          flutter_executable="$(readlink -f "$(command -v flutter)")"
          flutter_bin="$(dirname "$flutter_executable")"
          dart_executable="$flutter_bin/cache/dart-sdk/bin/dart"
          test -x "$dart_executable"
          "$dart_executable" tool/verify_flutter_sdk.dart \
            --flutter "$flutter_executable" \
            --dart "$dart_executable" \
            --expected-flutter 3.47.5 \
            --expected-dart 3.13.4
          printf 'BUSYMAX_FLUTTER_EXECUTABLE=%s\n' "$flutter_executable" >> "$GITHUB_ENV"
          printf 'BUSYMAX_DART_EXECUTABLE=%s\n' "$dart_executable" >> "$GITHUB_ENV"

      - name: Enable Linux desktop
        run: '"$BUSYMAX_FLUTTER_EXECUTABLE" config --enable-linux-desktop'

      - name: Resolve dependencies
        run: '"$BUSYMAX_FLUTTER_EXECUTABLE" pub get --enforce-lockfile'

      - name: Generate localizations
        run: '"$BUSYMAX_FLUTTER_EXECUTABLE" gen-l10n'

      - name: Generate Drift code
        run: >-
          "$BUSYMAX_DART_EXECUTABLE" run build_runner build
          --delete-conflicting-outputs --force-jit

      - name: Verify generated files are committed
        run: git diff --exit-code

      - name: Check formatting
        run: >-
          "$BUSYMAX_DART_EXECUTABLE" format
          --output=none --set-exit-if-changed .

      - name: Analyze
        run: '"$BUSYMAX_FLUTTER_EXECUTABLE" analyze'

      - name: Check platform boundaries
        run: >-
          "$BUSYMAX_DART_EXECUTABLE" run tool/check_platform_boundaries.dart

      - name: Test
        run: '"$BUSYMAX_FLUTTER_EXECUTABLE" test'

      - name: Test GTK header-icon bridge
        run: |
          gtk_config="$RUNNER_TEMP/busymax-gtk-config"
          mkdir -p "$gtk_config/gtk-3.0"
          printf '[Settings]\ngtk-icon-theme-name=Yaru\n' \
            > "$gtk_config/gtk-3.0/settings.ini"
          XDG_CONFIG_HOME="$gtk_config" xvfb-run -a \
            "$BUSYMAX_FLUTTER_EXECUTABLE" test \
            integration_test/gtk_header_icons_integration_test.dart -d linux

      - name: Test native clock patterns, weekday locale, and GTK time picker
        run: BUSYMAX_GTK_CONFIG="$RUNNER_TEMP/busymax-gtk-config" bash tool/release/check_linux_native.sh

      - name: Test local release tooling
        run: python3 -m unittest discover -s test/tool -p '*_test.py'

      - name: Test native registration helper teardown
        run: python3 test/tool/registration_native_helper_test.py

      - name: Test native registration configuration handles
        run: |
          cmake -S native/registration_reader -B build/linux/registration-reader-tests
          cmake --build build/linux/registration-reader-tests --target busymax_registration_reader_tests
          ctest --test-dir build/linux/registration-reader-tests --output-on-failure

      - name: Build unconfigured release with usable custom registration paths
        run: |
          "$BUSYMAX_FLUTTER_EXECUTABLE" build linux --release -t lib/main_linux.dart
          test -f build/linux/x64/release/bundle/data/flutter_assets/docs/google_setup.md
          test -f build/linux/x64/release/bundle/data/flutter_assets/docs/microsoft_setup.md

      - name: Build strict Snap from the release bundle
        id: snapcraft
        uses: snapcore/action-build@v1

      - name: Install strict Snap
        run: >-
          sudo snap install --dangerous
          "${{ steps.snapcraft.outputs.snap }}"

      - name: Verify installed strict Snap
        run: |
          LC_ALL=C snap info --verbose busymax |
            grep -Eq '^[[:space:]]*confinement:[[:space:]]+strict$'
          # shellcheck disable=SC2016
          snap run --shell busymax -c 'test -x "$SNAP/busymax"'
