name: Flutter Windows

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'Release/**'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Install pinned Pester
        shell: pwsh
        run: >-
          Install-Module Pester -RequiredVersion 5.7.1
          -Scope CurrentUser -Force -AllowClobber

      - name: Create explicitly non-production CI identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/windows | Out-Null
          @{
            production = $false
            identityName = 'BusyStack.BusyMax.CI'
            publisher = 'CN=BusyMax CI Package'
            publisherDisplayName = 'BusyMax CI'
            msixVersion = '1.0.0.0'
            previousMsixVersion = ''
            privacyPolicyUrl = 'https://busystack.org/privacy'
            supportUrl = 'https://busystack.org/support'
            homepageUrl = 'https://busystack.org'
            googleOAuthClientId = 'busymax-ci-google-client-id'
            googleOAuthClientSecret = ''
            microsoftOAuthClientId = 'busymax-ci-microsoft-client-id'
            microsoftOAuthAuthorityTenant = 'common'
            fakeData = $false
            developmentBackend = $false
          } | ConvertTo-Json | Set-Content `
            -LiteralPath build/windows/store-ci.json -Encoding utf8NoBOM

      - name: Verify x64 Windows build host
        shell: pwsh
        run: |
          if ($env:OS -ne 'Windows_NT' -or
              -not [Environment]::Is64BitOperatingSystem) {
            throw 'BusyMax Windows builds require 64-bit Windows.'
          }

      - name: Verify pinned Flutter version
        shell: pwsh
        run: |
          $version = (flutter --version --machine |
            ConvertFrom-Json).frameworkVersion
          if ($version -ne '3.44.4') {
            throw "BusyMax requires Flutter 3.44.4; found $version."
          }

      - name: Verify Visual Studio C++ toolchain
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if ([string]::IsNullOrWhiteSpace($installation)) {
            throw 'Visual Studio C++ x64 desktop tools were not found.'
          }

      - name: Verify Windows SDK packaging tools
        shell: pwsh
        run: |
          . ./tools/windows/common.ps1
          $kitsBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $sdk = Get-BusyMaxWindowsSdkDirectory -KitsBin $kitsBin
          if ($null -eq $sdk) {
            throw 'Windows SDK 10.0.26100.0 or newer is required.'
          }
          foreach ($tool in @('makeappx.exe', 'signtool.exe')) {
            if (-not (Test-Path -LiteralPath `
                (Join-Path $sdk.FullName "x64\$tool"))) {
              throw "$tool was not found in Windows SDK $($sdk.Name)."
            }
          }

      - name: Verify combined Windows build prerequisites
        shell: pwsh
        run: ./tools/windows/check_prerequisites.ps1 | Format-List

      - name: Validate non-production CI identity
        shell: pwsh
        run: >-
          ./tools/windows/validate_release_config.ps1
          -ConfigPath build/windows/store-ci.json
          -Ci | Format-List

      - name: Run pinned Pester contract tests
        shell: pwsh
        run: >-
          ./tools/windows/build_release.ps1
          -ConfigPath build/windows/store-ci.json
          -Ci -Stage PesterTests

      - name: Restore dependencies and generate sources
        shell: pwsh
        run: >-
          ./tools/windows/build_release.ps1
          -ConfigPath build/windows/store-ci.json
          -Ci -Stage SourceGeneration

      - name: Check formatting, analysis, and platform boundaries
        shell: pwsh
        run: >-
          ./tools/windows/build_release.ps1
          -ConfigPath build/windows/store-ci.json
          -Ci -Stage StaticAnalysis

      - name: Run Dart and Flutter tests
        shell: pwsh
        run: >-
          ./tools/windows/build_release.ps1
          -ConfigPath build/windows/store-ci.json
          -Ci -Stage FlutterTests

      - name: Compile Windows x64 release
        shell: pwsh
        run: >-
          ./tools/windows/build_release.ps1
          -ConfigPath build/windows/store-ci.json
          -Ci -Stage WindowsCompile

      - name: Run native C++ tests
        shell: pwsh
        run: >-
          ./tools/windows/build_release.ps1
          -ConfigPath build/windows/store-ci.json
          -Ci -Stage NativeTests

      - name: Pack and inspect exact MSIX
        shell: pwsh
        run: >-
          ./tools/windows/build_release.ps1
          -ConfigPath build/windows/store-ci.json
          -Ci -Stage Package

      - name: Upload Windows test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: busymax-windows-x64-test-reports
          path: build/windows/test-results/**
          if-no-files-found: warn

      - name: Upload unsigned CI MSIX and package evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: busymax-windows-x64-ci
          path: |
            build/windows/store/*.msix
            build/windows/store/staging/AppxManifest.xml
            build/windows/store/*inventory.json
            build/windows/store/*metadata.json
          if-no-files-found: error
