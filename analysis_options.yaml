include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - tool/google_tasks_discovery/cache/**
    - windows/**
    - linux/**
    - android/**
    - packages/**/example/**
    - packages/busymax_android_platform/example/**

linter:
  rules:
    prefer_initializing_formals: false
    prefer_single_quotes: true
    use_null_aware_elements: false
