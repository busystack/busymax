org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter 3.47.2 still casts the current AGP extension to the legacy variant
# API, so this one compatibility flag is required until the pinned Flutter
# Gradle plugin migrates. Kotlin compilation itself remains AGP 9 built-in.
android.newDsl=false
android.builtInKotlin=true
