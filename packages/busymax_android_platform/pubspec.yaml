name: busymax_android_platform
description: BusyMax-owned Android bridge for authorization, documents, clock, and cross-engine coordination.
version: 0.1.0
repository: https://github.com/BusyStack/BusyMax

environment:
  sdk: ^3.12.0
  flutter: '>=3.47.5'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.busystack.busymax_android_platform
        pluginClass: BusymaxAndroidPlatformPlugin
