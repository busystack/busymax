name: busymax
description: BusyMax calendar and task manager.
publish_to: 'none'
version: 0.1.7

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  collection: ^1.19.0
  connectivity_plus: ^7.1.0
  crypto: ^3.0.0
  cryptography: ^2.9.0
  dbus: ^0.7.14
  desktop_notifications: ^0.6.3
  drift: ^2.33.0
  file_selector: ^1.0.3
  fluent_ui: 4.16.1
  fluentui_system_icons: 1.1.273
  flutter_riverpod: ^2.6.0
  flutter_local_notifications: 22.3.0
  flutter_secure_storage: ^10.3.0
  flutter_timezone: 5.1.0
  go_router: ^17.3.0
  http: ^1.6.0
  infinite_calendar_view: ^2.11.5
  intl: ^0.20.0
  logging: ^1.3.0
  package_info_plus: ^10.1.0
  path: ^1.9.0
  path_provider: ^2.1.0
  posix: ^6.5.0
  sqlite3: ^3.3.0
  sqlite3_flutter_libs: ^0.6.0
  system_theme: ^3.3.0
  timezone: ^0.11.1
  tray_manager: 0.5.3
  ubuntu_localizations: ^0.5.2+3
  url_launcher: ^6.3.0
  uuid: ^4.5.0
  xdg_status_notifier_item: ^0.0.1
  xml: 6.6.1
  yaru: ^10.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  image: 4.8.0
  build_runner: ^2.15.0
  drift_dev: ^2.33.0
  flutter_lints: ^6.0.0
  mocktail: ^1.0.0
  msix: 3.18.0
  very_good_analysis: ^10.1.0

dependency_overrides:
  flutter_timezone:
    path: third_party/flutter_timezone
  tray_manager:
    path: third_party/tray_manager
  yaru_window:
    path: third_party/yaru_window
  xdg_status_notifier_item:
    path: third_party/xdg_status_notifier_item

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/busymax-logo.svg
    - assets/branding/busymax-logo-offline.svg
    - assets/branding/busymax-logo.png
    - assets/windows/busymax_tray.ico
    - assets/windows/busymax_tray_offline.ico

# Do not add google_sign_in for Linux OAuth. It does not support Linux.
# Do not add extension_google_sign_in_as_googleapis_auth for Linux OAuth.
# Do not use googleapis_auth directly in the Flutter app runtime.
