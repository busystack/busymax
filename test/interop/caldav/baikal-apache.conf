<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/baikal/html
    Alias /baikal/ /var/www/baikal/html/
    <Directory /var/www/baikal/html>
        Require all granted
        AllowOverride None
        Options -Indexes
        AcceptPathInfo On
    </Directory>
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
    RedirectMatch 302 ^/\.well-known/caldav$ /dav.php/
</VirtualHost>
