name: yaru_window
description: Linux-only BusyMax packaging of the upstream yaru_window API.
repository: https://github.com/ubuntu/yaru_window.dart
version: 0.2.2
publish_to: none

environment:
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  yaru_window_linux: 0.2.2
  yaru_window_platform_interface: 0.1.3

flutter:
  plugin:
    platforms:
      linux:
        default_package: yaru_window_linux
